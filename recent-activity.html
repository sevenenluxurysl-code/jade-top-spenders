<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Jade Recent Activity</title>

<style>

*
{
box-sizing: border-box;
margin: 0;
padding: 0;
}

html,
body
{
width: 100%;
height: 100%;

overflow: hidden;

background: transparent;

font-family:
Arial,
Helvetica,
sans-serif;
}

body
{
padding: 8px;
}

.panel
{
width: 100%;
height: 100%;

border:
2px solid
#b99643;

border-radius:
18px;

background:
radial-gradient(
circle at 50% 0%,
rgba(34, 145, 93, 0.15),
transparent 45%
),
linear-gradient(
145deg,
#050d0a 0%,
#0a1b14 50%,
#050d0a 100%
);

box-shadow:
inset 0 0 35px rgba(34, 190, 116, 0.06);

padding:
18px 22px;
}

.header
{
color:
#d9c276;

font-size:
22px;

font-weight:
800;

letter-spacing:
2px;

text-transform:
uppercase;

border-bottom:
1px solid
rgba(217, 194, 118, 0.35);

padding-bottom:
10px;

margin-bottom:
10px;
}

.activity-list
{
display: flex;
flex-direction: column;

gap: 8px;

height:
calc(100% - 50px);

overflow: hidden;
}

.activity
{
display: grid;

grid-template-columns:
18px
1fr
auto;

align-items: center;

gap: 10px;

min-height:
48px;

padding:
7px 10px;

border:
1px solid
rgba(207, 176, 79, 0.18);

border-radius:
10px;

background:
rgba(0, 0, 0, 0.18);
}

.diamond
{
color:
#4ed596;

font-size:
13px;
}

.name
{
color:
#f0e3b2;

font-size:
17px;

font-weight:
800;
}

.detail
{
color:
#72d9a3;

font-size:
13px;

font-weight:
600;

margin-top:
2px;
}

.amount
{
color:
#d9c276;

font-size:
17px;

font-weight:
900;

white-space:
nowrap;
}

.empty
{
height:
calc(100% - 50px);

display: flex;

align-items: center;

justify-content: center;

text-align: center;

color:
rgba(222, 202, 135, 0.60);

font-size:
18px;

font-weight:
700;

letter-spacing:
1px;
}

</style>

</head>

<body>

<div class="panel">

<div class="header">
Recent Activity
</div>

<div
id="activityList"
class="activity-list"
>
</div>

</div>


<script>

// ============================================================
// THE JADE EXPERIENCE
// RECENT ACTIVITY DISPLAY
//
// Reads activity JSON from:
//
// #data=[...]
//
// Each item:
//
// {
// "name":"morta",
// "type":"Service Booking",
// "amount":500
// }
//
// ============================================================


function getActivityData()
{
const hash =
new URLSearchParams(
window.location.hash.replace(
/^#/,
""
)
);

const raw =
hash.get(
"data"
);

if (
!raw
)
{
return [];
}

try
{
const parsed =
JSON.parse(
raw
);

if (
Array.isArray(
parsed
)
)
{
return parsed;
}
}

catch (error)
{
console.log(
error
);
}

return [];
}


// ============================================================
// CREATE ACTIVITY ROW
// ============================================================

function createActivityRow(item)
{
const row =
document.createElement(
"div"
);

row.className =
"activity";


const diamond =
document.createElement(
"div"
);

diamond.className =
"diamond";

diamond.textContent =
"◆";


const center =
document.createElement(
"div"
);


const name =
document.createElement(
"div"
);

name.className =
"name";

name.textContent =
item.name
||
"Client";


const detail =
document.createElement(
"div"
);

detail.className =
"detail";

detail.textContent =
item.type
||
"Activity";


center.appendChild(
name
);

center.appendChild(
detail
);


const amount =
document.createElement(
"div"
);

amount.className =
"amount";


const numericAmount =
Number(
item.amount
||
0
);


if (
numericAmount > 0
)
{
amount.textContent =
"L$"
+
numericAmount
.toLocaleString(
"en-US"
);
}
else
{
amount.textContent =
"";
}


row.appendChild(
diamond
);

row.appendChild(
center
);

row.appendChild(
amount
);


return row;
}


// ============================================================
// RENDER
// ============================================================

function render()
{
const list =
document.getElementById(
"activityList"
);


list.innerHTML =
"";


const activity =
getActivityData();


if (
activity.length === 0
)
{
const empty =
document.createElement(
"div"
);

empty.className =
"empty";

empty.textContent =
"◆ NO RECENT ACTIVITY";


list.appendChild(
empty
);


return;
}


activity
.slice(
0,
5
)
.forEach(
item =>
{
list.appendChild(
createActivityRow(
item
)
);
}
);
}


// ============================================================
// INITIAL LOAD
// ============================================================

render();


// ============================================================
// SECOND LIFE LIVE UPDATE
// ============================================================

window.addEventListener(
"hashchange",
render
);


window.addEventListener(
"pageshow",
render
);

</script>

</body>

</html>
