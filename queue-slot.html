<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Jade Queue Slot</title>


<style>

*
{
box-sizing: border-box;
margin: 0;
padding: 0;
}


html,
body
{
width: 100%;
height: 100%;

overflow: hidden;

background: transparent;

font-family:
Arial,
Helvetica,
sans-serif;
}


body
{
padding: 5px;
}


.slot
{
width: 100%;
height: 100%;

display: flex;
flex-direction: column;

align-items: center;
justify-content: center;

text-align: center;

border:
2px solid
#b99643;

border-radius:
12px;


background:

radial-gradient(
circle at 50% 0%,
rgba(
37,
171,
106,
0.17
),
transparent 50%
),

linear-gradient(
145deg,
#05100c 0%,
#0b2118 50%,
#06110d 100%
);


box-shadow:
inset
0
0
22px
rgba(
45,
192,
122,
0.08
);
}


.label
{
color:
#d9c276;

font-size:
15px;

font-weight:
900;

letter-spacing:
1.5px;

text-transform:
uppercase;

margin-bottom:
6px;
}


.name
{
color:
#65dda1;

font-size:
23px;

font-weight:
900;

line-height:
1.05;

max-width:
94%;

white-space:
nowrap;

overflow:
hidden;

text-overflow:
ellipsis;
}


.service
{
color:
#f0e3b2;

font-size:
12px;

font-weight:
600;

margin-top:
5px;

max-width:
94%;

white-space:
nowrap;

overflow:
hidden;

text-overflow:
ellipsis;
}


.empty
{
color:
rgba(
221,
205,
150,
0.55
);

font-size:
15px;

font-weight:
800;

letter-spacing:
1px;
}


.diamond
{
color:
#55d49a;

font-size:
10px;

margin-bottom:
4px;
}

</style>

</head>


<body>


<div
id="slot"
class="slot"
>
</div>


<script>

// ============================================================
// THE JADE EXPERIENCE
// QUEUE SLOT DISPLAY
//
// Reads:
//
// #label=CURRENT
// &name=morta
// &service=Jade%20Flirt
//
// Example:
//
// queue-slot.html#label=CURRENT&name=morta&service=Jade%20Flirt
//
// ============================================================


function readParams()
{
const query =
new URLSearchParams(
window.location.search
);


const hash =
new URLSearchParams(
window.location.hash.replace(
/^#/,
""
)
);


function get(name)
{
return (
hash.get(name)
||
query.get(name)
||
""
);
}


return {

label:
get(
"label"
),

name:
get(
"name"
),

service:
get(
"service"
)

};
}


// ============================================================
// SAFE TEXT ELEMENT
// ============================================================

function makeElement(
className,
text
)
{
const element =
document.createElement(
"div"
);


element.className =
className;


element.textContent =
text;


return element;
}


// ============================================================
// RENDER
// ============================================================

function render()
{
const params =
readParams();


const slot =
document.getElementById(
"slot"
);


slot.innerHTML =
"";


const label =
makeElement(
"label",
params.label || "QUEUE"
);


slot.appendChild(
label
);


// --------------------------------------------------------
// EMPTY SLOT
// --------------------------------------------------------

if (
!params.name
)
{
const empty =
makeElement(
"empty",
"◆ NO CLIENT"
);


slot.appendChild(
empty
);


return;
}


// --------------------------------------------------------
// CLIENT
// --------------------------------------------------------

const diamond =
makeElement(
"diamond",
"◆"
);


const name =
makeElement(
"name",
params.name
);


const service =
makeElement(
"service",
params.service || "BOOKING"
);


slot.appendChild(
diamond
);


slot.appendChild(
name
);


slot.appendChild(
service
);
}


// ============================================================
// FIRST LOAD
// ============================================================

render();


// ============================================================
// SECOND LIFE LIVE UPDATES
// ============================================================

window.addEventListener(
"hashchange",
render
);


window.addEventListener(
"pageshow",
render
);

</script>


</body>

</html>
