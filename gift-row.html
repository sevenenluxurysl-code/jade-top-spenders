<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jade Pending Gift Row</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html,
body {
width: 100%;
height: 100%;
overflow: hidden;
background: transparent;
font-family: Arial, Helvetica, sans-serif;
}

body {
display: flex;
align-items: center;
justify-content: center;
padding: 8px;
}

.row {
width: 100%;
height: 100%;

position: relative;

display: grid;
grid-template-columns: 1fr auto;
grid-template-rows: auto auto;
align-items: center;

padding: 18px 24px;

border: 2px solid #b89742;
border-radius: 18px;

background:
radial-gradient(
circle at 10% 20%,
rgba(39, 160, 102, 0.18),
transparent 30%
),
linear-gradient(
135deg,
#07120f 0%,
#0b2118 45%,
#07100d 100%
);

box-shadow:
inset 0 0 30px rgba(38, 180, 112, 0.10),
0 0 14px rgba(218, 183, 83, 0.22);
}

.row::before {
content: "";
position: absolute;
inset: 5px;

border: 1px solid rgba(224, 193, 102, 0.23);
border-radius: 13px;

pointer-events: none;
}

.client {
position: relative;
z-index: 2;

color: #f0d98a;

font-size: 27px;
font-weight: 800;
letter-spacing: 1px;

text-shadow:
0 0 8px rgba(218, 189, 92, 0.25);
}

.gift {
position: relative;
z-index: 2;

margin-top: 6px;

color: #d8eee1;

font-size: 20px;
font-weight: 600;
letter-spacing: 0.5px;
}

.amount-wrap {
position: relative;
z-index: 2;

grid-column: 2;
grid-row: 1 / span 2;

text-align: right;
padding-left: 22px;
}

.amount {
color: #57d697;

font-size: 30px;
font-weight: 900;

text-shadow:
0 0 11px rgba(55, 211, 140, 0.28);
}

.status {
display: inline-block;

margin-top: 6px;
padding: 5px 12px;

border: 1px solid rgba(221, 190, 91, 0.65);
border-radius: 20px;

color: #e8cf7d;
background: rgba(0, 0, 0, 0.32);

font-size: 13px;
font-weight: 700;
letter-spacing: 1.5px;
}

.empty {
width: 100%;
text-align: center;

color: rgba(226, 210, 162, 0.55);

font-size: 22px;
font-weight: 700;
letter-spacing: 2px;
}

.diamond {
color: #5bd89a;
margin-right: 7px;
}
</style>
</head>

<body>

<div id="giftRow" class="row">
<div>
<div id="client" class="client"></div>
<div id="gift" class="gift"></div>
</div>

<div class="amount-wrap">
<div id="amount" class="amount"></div>
<div id="status" class="status"></div>
</div>
</div>


<script>
const params =
new URLSearchParams(
window.location.hash.substring(1)
);

const client =
params.get("client") || "";

const gift =
params.get("gift") || "";

const amount =
params.get("amount") || "";

const status =
params.get("status") || "";


const row =
document.getElementById("giftRow");


if (!client) {

row.innerHTML =
'<div class="empty">'
+ '<span class="diamond">◆</span>'
+ 'NO PENDING GIFT'
+ '</div>';

row.style.display = "flex";
row.style.alignItems = "center";
row.style.justifyContent = "center";
}

else {

document.getElementById(
"client"
).textContent =
client;


document.getElementById(
"gift"
).textContent =
gift;


document.getElementById(
"amount"
).textContent =
"L$" + amount;


document.getElementById(
"status"
).textContent =
status;
}
</script>

</body>
</html>
