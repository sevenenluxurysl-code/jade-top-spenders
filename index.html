<script>

// =====================================================
// PUT YOUR WORKING JADE API URL HERE
//
// IMPORTANT:
// This is your jade-api URL.
// NOT the jade-leaderboard URL.
// =====================================================

const JADE_API =
"https://toalyianadfotcvmwcmx.supabase.co/functions/v1/jade-leaderboard";


// =====================================================
// SETTINGS
// =====================================================

let currentScope =
"ALL_TIME";


// Refresh the current leaderboard every 60 seconds.
const REFRESH_MS =
60000;


// Automatically rotate All-Time / Monthly every 45 sec.
const ROTATE_MS =
45000;


// =====================================================
// URL SETTINGS
//
// Later:
// ?compact=1
//
// gives us the future HUD version.
// =====================================================

const params =
new URLSearchParams(
window.location.search
);


if (
params.get(
"compact"
) ===
"1"
)
{
document.body.classList.add(
"compact"
);
}


// =====================================================
// HTML SAFETY
// =====================================================

function escapeHTML(
value
)
{
return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);
}


// =====================================================
// FORMAT LINDENS
// =====================================================

function formatLindens(
amount
)
{
let number =
Number(
amount ?? 0
);


if (
!Number.isFinite(
number
)
)
{
number = 0;
}


return (
"L$"
+
number.toLocaleString(
"en-US"
)
);
}


// =====================================================
// STATUS ICON
// =====================================================

function getStatusIcon(
status
)
{
switch (
status
)
{
case "Crown Jewel":
return "♛";

case "High Society":
return "◇";

case "Rare Gem":
return "◆";

case "Polished":
return "✦";

default:
return "♡";
}
}


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
text
)
{
document.getElementById(
"rows"
).style.display =
"none";


const message =
document.getElementById(
"message"
);


message.style.display =
"block";


message.innerHTML =
escapeHTML(
text
);
}


// =====================================================
// SHOW ROW AREA
// =====================================================

function showRows()
{
document.getElementById(
"message"
).style.display =
"none";


document.getElementById(
"rows"
).style.display =
"block";
}


// =====================================================
// BUILD ONE ROW
// =====================================================

function buildRow(
entry,
index
)
{
const rank =
escapeHTML(
entry.rank ??
index + 1
);


const name =
escapeHTML(
entry.display_name ??
"Anonymous"
);


const status =
escapeHTML(
entry.status_title ??
"Jade Guest"
);


const rawSpend =
currentScope ===
"MONTHLY"

? entry.monthly_spend

: entry.total_spend;


const spend =
escapeHTML(
formatLindens(
rawSpend
)
);


const statusIcon =
getStatusIcon(
String(
entry.status_title ??
""
)
);


const crown =
index === 0
? "♛"
: "";


const topClass =
index === 0
? " top"
: "";


return `
<div class="row${topClass}">

<div class="rank-cell">

<span class="rank-crown">
${crown}
</span>

<span class="rank">
#${rank}
</span>

</div>


<div class="client">
${name}
</div>


<div class="status">

<span class="status-icon">
${statusIcon}
</span>

<span>
${status}
</span>

</div>


<div class="spend">
${spend}
</div>

</div>
`;
}


// =====================================================
// BUILD EMPTY ROW
// =====================================================

function buildEmptyRow(
position
)
{
return `
<div class="row empty">

<div class="rank-cell">

<span class="rank-crown">
</span>

<span class="rank">
#${position}
</span>

</div>


<div class="client">
—
</div>


<div class="status">
—
</div>


<div class="spend">
—
</div>

</div>
`;
}


// =====================================================
// DRAW LEADERBOARD
// =====================================================

function drawLeaderboard(
entries
)
{
showRows();


let html =
"";


const limit =
5;


for (
let i = 0;
i < limit;
i++
)
{
if (
entries[i]
)
{
html +=
buildRow(
entries[i],
i
);
}

else
{
html +=
buildEmptyRow(
i + 1
);
}
}


document.getElementById(
"rows"
).innerHTML =
html;
}


// =====================================================
// UPDATE VISUAL MODE
// =====================================================

function updateModeUI()
{
const allTimeButton =
document.getElementById(
"allTimeButton"
);


const monthlyButton =
document.getElementById(
"monthlyButton"
);


const subtitle =
document.getElementById(
"subtitle"
);


if (
currentScope ===
"MONTHLY"
)
{
monthlyButton
.classList
.add(
"active"
);


allTimeButton
.classList
.remove(
"active"
);


subtitle.textContent =
"MONTHLY ELITE LIST";
}

else
{
allTimeButton
.classList
.add(
"active"
);


monthlyButton
.classList
.remove(
"active"
);


subtitle.textContent =
"ALL-TIME ELITE LIST";
}
}


// =====================================================
// FETCH JADE CENTRAL
// =====================================================

async function loadLeaderboard()
{
if (
JADE_API.includes(
"PASTE_YOUR"
)
)
{
showMessage(
"Jade API URL has not been added yet."
);

return;
}


try
{
const response =
await fetch(
JADE_API,
{
method:
"POST",

headers:
{
"Content-Type":
"application/json"
},

body:
JSON.stringify(
{
action:
"get_leaderboard",

scope:
currentScope
}
)
}
);


if (
!response.ok
)
{
throw new Error(
"Jade Central returned HTTP "
+
response.status
);
}


const data =
await response.json();


if (
data.success !==
true
)
{
throw new Error(
data.error ??
"Leaderboard request failed."
);
}


const leaderboard =
Array.isArray(
data.leaderboard
)

? data.leaderboard

: [];


drawLeaderboard(
leaderboard
);
}


catch (
error
)
{
console.error(
error
);


showMessage(
"Jade Central is refreshing the leaderboard."
);
}
}


// =====================================================
// CHANGE SCOPE
// =====================================================

function setScope(
scope
)
{
currentScope =
scope ===
"MONTHLY"

? "MONTHLY"

: "ALL_TIME";


updateModeUI();


loadLeaderboard();
}


// =====================================================
// AUTOMATIC ROTATION
// =====================================================

setInterval(
() =>
{
if (
currentScope ===
"ALL_TIME"
)
{
setScope(
"MONTHLY"
);
}

else
{
setScope(
"ALL_TIME"
);
}
},

ROTATE_MS
);


// =====================================================
// LIVE REFRESH
// =====================================================

setInterval(
() =>
{
loadLeaderboard();
},
